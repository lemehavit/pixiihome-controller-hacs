name: Release checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install ".[test]"
      - run: python -m ruff check .
      - run: python -m pyright
      - run: python -m pytest
      - run: python scripts/build_release.py --check --version "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361
  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          comment: "false"
